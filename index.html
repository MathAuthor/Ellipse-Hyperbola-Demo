<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conic Section Ray Tracing Demo</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #111827;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        canvas {
            background: #1f2937;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .info {
            margin-top: 10px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <h2>Conic Section Ray Tracing</h2>
    <canvas id="simCanvas" width="600" height="400"></canvas>
    
    <div class="controls">
        <button onclick="setMode('ellipse')">Ellipse Mode</button>
        <button onclick="setMode('hyperbola')">Hyperbola Mode</button>
    </div>
    <div class="info">Drag the vertices/foci parameters on screen to reshape.</div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        let mode = 'ellipse';
        let a = 180; // Semi-major axis
        let b = 120; // Semi-minor axis
        let c = Math.sqrt(a*a - b*b); // Focal distance
        
        let isDragging = false;
        let dragTarget = null;

        function setMode(newMode) {
            mode = newMode;
            if (mode === 'hyperbola') {
                a = 100;
                b = 80;
            } else {
                a = 180;
                b = 120;
            }
            updateFoci();
            draw();
        }

        function updateFoci() {
            if (mode === 'ellipse') {
                c = Math.sqrt(Math.max(0, a*a - b*b));
            } else {
                c = Math.sqrt(a*a + b*b);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            updateFoci();

            // Draw Axes/Guidelines
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();

            // Draw the Conic Curve
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            if (mode === 'ellipse') {
                ctx.ellipse(cx, cy, a, b, 0, 0, Math.PI * 2);
                ctx.stroke();
            } else {
                // Draw both branches of hyperbola
                for (let side = -1; side <= 1; side += 2) {
                    ctx.beginPath();
                    let started = false;
                    for (let t = -1.5; t <= 1.5; t += 0.05) {
                        let x = cx + side * a * Math.cosh(t);
                        let y = cy + b * Math.sinh(t);
                        if (x >= 0 && x <= canvas.width && y >= 0 && y <= canvas.height) {
                            if (!started) { ctx.moveTo(x, y); started = true; }
                            else ctx.lineTo(x, y);
                        }
                    }
                    ctx.stroke();
                }
            }

            // Foci Positions
            let f1x = cx - c, f2x = cx + c;

            // Draw Foci Points
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath(); ctx.arc(f1x, cy, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(f2x, cy, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText("F1", f1x - 18, cy - 10);
            ctx.fillText("F2", f2x + 8, cy - 10);

            // Ray Tracing
            ctx.lineWidth = 1.5;
            const numRays = 12;

            if (mode === 'ellipse') {
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.6)'; // Blue rays
                for (let i = 0; i < numRays; i++) {
                    let angle = (Math.PI * 2 / numRays) * i;
                    // Find intersection of ray from F1 with ellipse
                    // Parametric ray: x = f1x + t*cos, y = cy + t*sin
                    // Ellipse: (x-cx)^2/a^2 + (y-cy)^2/b^2 = 1
                    let cos = Math.cos(angle);
                    let sin = Math.sin(angle);
                    
                    // Quadratic formula components to find intersection point P
                    let A = (cos*cos)/(a*a) + (sin*sin)/(b*b);
                    let B = 2 * (-c * cos) / (a*a);
                    let C = (c*c)/(a*a) - 1;
                    let discriminant = B*B - 4*A*C;
                    
                    if (discriminant >= 0) {
                        let t = (-B + Math.sqrt(discriminant)) / (2*A);
                        let px = f1x + t * cos;
                        let py = cy + t * sin;

                        // Draw Ray from F1 to Perimeter to F2
                        ctx.beginPath();
                        ctx.moveTo(f1x, cy);
                        ctx.lineTo(px, py);
                        ctx.lineTo(f2x, cy);
                        ctx.stroke();
                    }
                }
            } else {
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)'; // Red rays
                for (let i = 0; i < numRays; i++) {
                    let angle = -Math.PI/3 + (Math.PI * 2 / 3) * (i / (numRays - 1));
                    let cos = Math.cos(angle);
                    let sin = Math.sin(angle);

                    // Rays emanating from F1 hitting the right branch
                    let A = (cos*cos)/(a*a) - (sin*sin)/(b*b);
                    let B = 2 * (-c * cos) / (a*a);
                    let C = (c*c)/(a*a) - 1;
                    let discriminant = B*B - 4*A*C;

                    if (discriminant >= 0) {
                        let t = (-B + Math.sqrt(discriminant)) / (2*A);
                        if (t > 0) {
                            let px = f1x + t * cos;
                            let py = cy + t * sin;

                            // Reflected direction is directly away from F2
                            let dx = px - f2x;
                            let dy = py - cy;
                            let len = Math.sqrt(dx*dx + dy*dy);
                            dx /= len; dy /= len;

                            // Draw outgoing path
                            ctx.beginPath();
                            ctx.moveTo(f1x, cy);
                            ctx.lineTo(px, py);
                            ctx.lineTo(px + dx * 300, py + dy * 300);
                            ctx.stroke();
                        }
                    }
                }
            }
        }

        // Simple interactive dragging mechanics for adjusting a and b
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (Math.abs(my - cy) < 20) {
                isDragging = true;
                dragTarget = 'a';
            } else {
                isDragging = true;
                dragTarget = 'b';
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (dragTarget === 'a') {
                a = Math.max(30, Math.abs(mx - cx));
            } else if (dragTarget === 'b') {
                b = Math.max(30, Math.abs(my - cy));
            }
            draw();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            dragTarget = null;
        });

        // Initialize
        draw();
    </script>
</body>
</html>
